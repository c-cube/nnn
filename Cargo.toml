[package]
name = "nounours"
version = "0.1.0"
edition = "2021"
description = "Minimal Linux sandbox using Landlock"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
landlock = "0.4"
glob = "0.3"
nix = { version = "0.29", features = ["process"] }
miniz_oxide = "0.8"

[build-dependencies]
miniz_oxide = "0.8"
serde_json = "1"
